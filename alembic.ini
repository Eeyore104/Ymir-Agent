# Alembic configuration.
# NOTE: keep this file ASCII-only; Alembic reads it with the OS locale encoding,
# so non-ASCII (e.g. CJK) comments break on GBK/CP936 Windows locales.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Placeholder URL; the real connection string is injected by migrations/env.py
# from ymir.config.Settings (honours the YMIR_DB_PATH env var).
sqlalchemy.url = sqlite+aiosqlite:///data/ymir.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
