# ymir-agent 模型网关配置（docs/02 §3.9、docs/05 T2-1）
#
# 安全约定：密钥只走环境变量（api_key_env 指向的变量名），禁止把密钥写进本文件、
# 禁止入库、禁止进日志（docs/02 §10.3-7）。
#
# 价格单位：元 / 百万 token（price_in=输入价，price_out=输出价）。
# 扩展方式：新增 provider 按同构结构追加即可（OpenAI 兼容端点）：
#   qwen:  { base_url: https://dashscope.aliyuncs.com/compatible-mode/v1, api_key_env: QWEN_API_KEY, ... }
#   glm:   { base_url: https://open.bigmodel.cn/api/paas/v4, api_key_env: GLM_API_KEY, ... }
#   kimi:  { base_url: https://api.moonshot.cn/v1, api_key_env: KIMI_API_KEY, ... }
# 非 OpenAI 协议（如 Anthropic）走 gateway/adapters 适配器（v1.x 预留）。

version: "1.0"

providers:
  deepseek:
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    enabled: true
    models:
      deepseek-reasoner:
        tier: planner   # 推理模型：PM / 架构师 等规划类角色
        price_in: 4.0
        price_out: 12.0
        # v1.2 起 8192 -> 32768：模板约束注入 + 全栈需求让输出显著变长，
        # 8192 会在 PRD / 架构文档中途截断（2026-10-23 T5.1 实测：三次 planner
        # 调用的 completion_tokens 分别顶死在 8191 / 8192 / 8192，finish=length）。
        # 截断的文档再喂给下游，等于让架构师基于半份 PRD 做设计。
        # 注意：max_tokens 只是**上限**，按实际输出计费，调高本身不增加成本。
        max_tokens: 32768
      deepseek-chat:
        tier: executor  # 快模型：工程师 / QA 等执行类角色
        price_in: 1.0
        price_out: 2.0
        # v1.2 起 8192 -> 16384：engineer 要一次性输出 CodeBundle 的完整 JSON
        # （全栈项目 = 后端多文件 + 前端多文件），8192 处必然截断 ——
        # 2026-10-23 T5.1 实测两次尝试 completion_tokens 都是 8192、finish=length，
        # 下游报「无法从模型输出提取 JSON 对象」（JSON 不完整）。
        # 已单独实测该模型可真实输出 16384 tokens（finish=length 顶到 16384 才停）。
        max_tokens: 16384

# 分级路由：tier -> 候选模型优先级列表（左侧优先，失败沿链降级）。
# 未配置密钥的 provider 会被自动跳过（见 providers.is_available）。
routing:
  planner:
    - deepseek-reasoner
  executor:
    - deepseek-chat

# 预算红线（超限 -> 引擎暂停 run + SSE budget.exceeded 告警）
budget:
  per_run_tokens: 500000    # 单次运行 token 上限
  per_day_cost_cny: 50      # 全局日成本上限（元，UTC 日）
