# ymir-agent 软件研发流水线（docs/02 §3.2；docs/07 §4.3.2 v1.1 声明式回边）
#
# 声明式 SOP：阶段 -> 关卡 -> 流转。编排内核只解释执行，改流程不改代码。
# 关卡流转（approved / rejected）由 HITL 引擎注入；本文件声明
# stage_completed 主链路、各阶段 gate 元数据，以及 v1.1 的 repair 回边。
# 校验器：SopValidator（ID 唯一 / inputs 可被上游满足 / 转移边可达终点 /
# on_reject_target 存在 / 角色已注册 / repair 声明合法）。
#
# repair 语义（docs/07 §4.3.3）：
# - 「非法」= 指向不存在的阶段 / 轮次为负 / 回边缺失 -> 加载期 error，run 不启动；
# - 「关闭」= enabled: false 或 max_rounds: 0 -> 仅 warning，运行期退回 v1.0 线性行为。

id: software-dev
version: "1.1"
description: 需求 → PRD → 架构 → 代码 → 评测 →（未达标）定向修复 ≤2 轮

repair:                       # ★v1.1 新增：声明式自愈（改这里即可，不改代码）
  enabled: true
  max_rounds: 2               # 0 = 关闭回边（退出 v1.0 线性行为，不报错）
  stage: coding               # 允许修复的阶段（v1.1 单目标）
  on_failure: evaluation_failed
  eval:
    suite: default            # 裁决套件；benchmark 脚本用 run.context 覆盖为 benchmark-12
    task: null
  context:
    max_failed_checks: 5
    max_detail_chars: 1200

stages:
  - id: prd
    role: pm
    inputs: [requirement]
    outputs: [prd]
    gate: { name: "PRD 确认", type: human_approval, on_reject_target: prd }
  - id: architecture
    role: architect
    inputs: [prd]
    outputs: [design]
    gate: { name: "设计评审", type: human_approval, on_reject_target: architecture }
  - id: coding
    role: engineer
    inputs: [prd, design]
    outputs: [code]
    use_sandbox: true
    gate: { name: "代码合并前评审", type: human_approval, on_reject_target: coding }
  - id: evaluation
    role: qa
    inputs: [prd, design, code]
    outputs: [evaluation_report]
    gate: null                      # 评测后人工终审由 Web 端主动查看，不设阻断关卡

# 注意（YAML 1.1 陷阱）：流转边的键 `on` 必须**加引号**写成 `"on"`。
# 未加引号时 PyYAML 按 YAML 1.1 把键 `on` 解析成布尔键 `True`，该字段会被静默
# 丢弃并回退到 TransitionSpec 的缺省值 `stage_completed` —— v1.0 因所有边恰好都是
# 主链事件而侥幸正确，v1.1 引入 `evaluation_failed` 回边后必须显式加引号。
transitions:
  - { from: prd,          "on": stage_completed,   to: architecture }
  - { from: architecture, "on": stage_completed,   to: coding }
  - { from: coding,       "on": stage_completed,   to: evaluation }
  - { from: evaluation,   "on": stage_completed,   to: __end__ }   # 通过 / 关闭回边时走这条
  - { from: evaluation,   "on": evaluation_failed, to: coding }    # ★v1.1 新增回边
