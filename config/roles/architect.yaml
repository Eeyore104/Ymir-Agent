# 架构师（架构设计 §3.1）
# tier=planner：规划模型（deepseek-reasoner）；输出契约 DesignDocument。

id: architect
name: 架构师
description: 负责模块划分、技术选型、接口草案与目录结构，产出设计文档
tier: planner
system_prompt: prompts/architect.md.j2
capabilities: [doc_write, read_artifact]
inputs: [prd]
outputs: [design]
output_schema: DesignDocument
retry: { max_attempts: 2 }
temperature: 0.3
# v1.2：8192 -> 32768。角色级值优先于 models.yaml（gateway.py:204）。
# 架构文档含模块划分 + 目录结构 + 接口契约，全栈需求下 8192 会截断，
# 下游工程师会基于残缺设计写代码（2026-10-23 T5.1 实测）。
max_tokens: 32768
