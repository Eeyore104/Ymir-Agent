# 工程师（架构设计 §3.1）
# tier=executor：执行模型（deepseek-chat）；输出契约 CodeBundle；
# coding 阶段 use_sandbox=true，产物在沙箱内冒烟执行（§3.5）。

id: engineer
name: 工程师
description: 依据 PRD 与设计文档实现代码，并在沙箱内冒烟验证
tier: executor
system_prompt: prompts/engineer.md.j2
capabilities: [code_write, read_artifact]
inputs: [prd, design]
outputs: [code]
output_schema: CodeBundle
retry: { max_attempts: 2 }
temperature: 0.2
# v1.2：8192 -> 16384。角色级值优先于 models.yaml（gateway.py:204），**这是
# CodeBundle 被截断的直接原因**：engineer 要一次性输出完整 JSON（全栈项目 =
# 后端多文件 + 前端多文件），8192 处必然断在 JSON 中途，角色层报
# 「无法从模型输出提取 JSON 对象」。
# 16384 为该模型（deepseek-chat）实测可真实输出的上限，已单独验证
# completion_tokens=16384 / finish=length。
max_tokens: 16384
