# 产品经理（架构设计 §3.1）
# tier=planner：规划模型（deepseek-reasoner）；输出契约 PRDDocument。

id: pm
name: 产品经理
description: 负责需求结构化、验收标准与用户故事，产出 PRD
tier: planner
system_prompt: prompts/pm.md.j2
capabilities: [doc_write]
inputs: [requirement]
outputs: [prd]
output_schema: PRDDocument
retry: { max_attempts: 2 }
temperature: 0.4
# v1.2：8192 -> 32768。角色级 max_tokens **优先于** config/models.yaml 的模型级值
# （gateway.py:204 先看角色传入值），所以只改 models.yaml 不生效。
# PRD 含需求池 + 用户故事 + 验收标准，全栈需求下 8192 会中途截断
# （2026-10-23 T5.1 实测 completion_tokens 顶死 8191/8192，下游拿到半份 PRD）。
max_tokens: 32768
