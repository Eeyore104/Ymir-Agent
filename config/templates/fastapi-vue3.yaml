# FastAPI + Vue3 全栈模板（v1.2，docs/09 §4.1.1 / §9-T1.4）
#
# 骨架清单（**恰为 5 个 = max_files 上限**，加第 6 个即超限）：
#   ① pyproject.toml   reserved  —— 打包/测试口径，逐字节要求精确
#   ② ruff.toml        reserved  —— **必须存在**：checks 里跑 `ruff check .`
#   ③ requirements.txt seed      —— 新增依赖的正规出口，允许模型整文件重写
#   ④ app/main.py      seed      —— 最小入口，模型在其上写路由（必须输出完整版）
#   ⑤ .env.example     reserved  —— 只写空值，禁止真实密钥
# 注：ruff 配置**只有一个来源**（ruff.toml）；pyproject.toml 内不再写 [tool.ruff]，
#     否则两处配置漂移，模型写出的"合规代码"会被判违规。
# 注：行长度 100 是**每行字符上限**（ruff line-length），与 layout.max_file_lines
#     （每文件行数上限 600）是两个不同的轴，前者对齐文档 §13 的定案值。

id: fastapi-vue3
version: "1.0"
name: FastAPI + Vue3 全栈
description: Python 后端 FastAPI + 前端 Vue3 的工程规范包（后端真执行、前端仅静态检查）
supports: [from_scratch, patch]

stack:
  language: python
  runtime: "3.12"
  backend: fastapi
  frontend: vue3
  dependencies: [fastapi, uvicorn, sqlalchemy, aiosqlite, alembic]
  package_manager: uv

layout:
  required_dirs: [app, tests, web/src]
  required_files: [pyproject.toml]
  any_of_files:
    - [pyproject.toml, requirements.txt]
  forbidden_dirs: [venv, node_modules, .venv]
  snake_case_py: true
  max_file_lines: 600
  allowed_prefixes: [app/, tests/, web/]
  frontend:
    required_dirs: [web/src, web/src/components]
    required_glob: ["web/src/**/*.vue"]
    forbidden_imports: [jquery, bootstrap]

conventions:
  - { path: README.md, required: true }
  - { path: .gitignore, required: true }

# 受保护路径（v1.3 T1.1，docs/11 §7.2.6）：增量模式下基线自带的测试基础设施
# 不可被静默覆盖 —— 两次实测都是"模型重写 tests/conftest.py ⇒ 基线既有用例集体失效"。
# on_hit=reject（Q1 定案 A）：命中即抛 ProtectedPathConflict（1003/409），
# 编排层随后做「1 次定向重试 + 兜底 ignore」，整轮不报废。
protected:
  paths:
    - tests/conftest.py
  on_hit: reject
  max_change_ratio: 0.5
  # W3-B′（v1.3.1 T3.3）：引用感知的符号删除检测，显式收紧为 reject。
  # 本模板的入口 `app/main.py` 是骨架 seed ⇒ 校验 18 禁止它进 protected.paths
  # （Q2 的 A 方案在此失效），符号检测是这一场景唯一的通用保护。
  symbol_deletions: reject

skeleton:
  max_files: 5
  max_bytes: 32768
  files:
    - path: pyproject.toml
      reserved: true
      content: |
        [project]
        name = "app"
        requires-python = ">=3.12"

        [tool.pytest.ini_options]
        pythonpath = ["."]
    - path: ruff.toml
      reserved: true
      content: |
        line-length = 100
        target-version = "py312"

        [lint]
        select = ["E", "F", "I", "B", "UP", "C4", "SIM", "W"]
        # FastAPI 的依赖注入写法是 `x: T = Depends(...)`，与 B008（禁止函数调用作
        # 参数默认值）天然冲突；否则**任何**合规代码都恒被判违规（T5.1 真跑实测：
        # 基线 4 条 B008 把基线探针判成 unhealthy，导致 regression 归因失效）。
        #
        # ★ v1.4（T5.2，docs/15 §3.5）：全局 `ignore = ["B008"]` 改为
        #   **per-file-ignores** —— 只在「用 Depends 做依赖注入」的**应用层**
        #   （入口与路由）忽略它，服务层 / 脚本 / 测试里的"函数调用作默认值"
        #   照常报 B008。全局 ignore 等于把这条规则整个关掉，那不是"框架惯例例外"，
        #   而是**放松检查**。
        #
        # ★ 作用域为什么是 `app/**`：模板自己的骨架入口是 `app/main.py`，模型产出的
        #   路由层落在 `app/` 下（`app/api/*.py` / `app/routers/*.py` 都覆盖），
        #   而 `tests/` 与仓库根目录的脚本**不在**该作用域内 —— 那里出现 B008
        #   通常是真的写错了（例如把 `time.time()` 当默认值），必须报出来。
        [lint.per-file-ignores]
        "app/**" = ["B008"]
        # 注：本骨架只在"基线没有 ruff.toml"时生效；模板 checks 里的
        # `--per-file-ignores "app/**:B008"` 负责覆盖"基线自带旧配置"的情形，
        # 两者互补（同一条作用域，不同落点）。
    - path: requirements.txt
      reserved: false
      content: |
        fastapi>=0.115
        uvicorn>=0.30
        sqlalchemy>=2.0
    - path: app/main.py
      reserved: false
      content: |
        from fastapi import FastAPI

        app = FastAPI()
    - path: .env.example
      reserved: true
      content: |
        # 复制为 .env 后填写；真实密钥禁止入库
        APP_ENV=dev
        DATABASE_URL=

# v1.3（T2.3）：checks 分三组（group），配合 scoring 做**分组配分**：
#   backend         —— Python 四件套（编译 / 测试 / lint / 导入）
#   frontend_build  —— `fe-build web`：镜像内**离线**构建脚本（npm ci --offline →
#                      回退 /opt/fe-baseline/node_modules → npm run build）
# frontend_static 没有 check：由前端结构规则打分（见 evaluation/runnability.py）
#
# ★★ v1.5（T1，docs/17 §1.2.1/§1.2.2）：把「不可用」的三档做成**一等字段** `tier`：
#   - D1 `loadable`（不可加载）/ D2 `behavior`（行为不符）⇒ **强制阻断**；
#   - D3 `style`（规范不符）⇒ **不阻断**，只扣分；
#   - 环境缺失（`requires_deps` / `requires` / `requires_build_output` 不满足）
#     ⇒ `skipped`，**不扣分、不阻断**，报告记「未验证」（未验证 ≠ 通过）。
# ★ 改动面**只**是 tier / blocking / requires* / timeout_s：
#   `weight`、`group`、`scoring.runnability_points`（backend 10 / frontend_static 10 /
#   frontend_build 10）与四维权重、双门槛**一字未改**。
checks:
  # ---- D1 不可加载（阻断）----
  # compileall 只做语法编译、**不 import** ⇒ 不依赖第三方包（无 requires_deps）
  - { type: command, run: "python -m compileall -q app", weight: 1, group: backend,
      tier: loadable, blocking: true, timeout_s: 120 }
  # ---- D2 行为不符（阻断）----
  # requires_deps: python:* ⇒ 交付树声明的包镜像里没有 ⇒ 跳过（环境缺失，不扣分）；
  # no_tests_exit_code: 5 ⇒ pytest「未收集到用例」记 skipped(no_tests_collected)，不是失败
  - { type: command, run: "python -m pytest -q", weight: 2, group: backend,
      tier: behavior, blocking: true, requires_deps: ["python:*"],
      no_tests_exit_code: 5, timeout_s: 180 }
  # ★ v1.4（T5.2）：`--ignore B008` 改成**限定作用域**的 `--per-file-ignores`。
  #   这一条负责"基线无关"的那一半修复（另一半是骨架 ruff.toml 里的
  #   `[lint.per-file-ignores]`）：骨架优先级 1 规定"基线已有该路径 ⇒ 骨架完全不参与"
  #   （记 skipped_existing），所以当基线**自带** ruff.toml（例如 v1.2 时代生成的
  #   既有工程）时，合并树用的是基线那份旧配置 —— 只改骨架对这类基线无效。
  #   作用域与骨架**同一条**（仅应用层 `app/`），其余目录的 B008 照常报错：
  #   全局 `--ignore B008` 会把规则整个关掉，那是放松检查而不是框架惯例例外。
  #   ⚠ 已记录的取舍：ruff 的 CLI `--per-file-ignores` 会**覆盖**配置文件里的
  #   per-file-ignores；基线自带的 per-file-ignores 因此在检查时失效（方向是
  #   "多报错"= fail-closed，不会放过真问题）。
  # ---- D3 规范不符（**不阻断**）----
  - { type: command, run: 'ruff check --per-file-ignores "app/**:B008" .', weight: 1,
      group: backend, tier: style, timeout_s: 120 }
  # ---- D1 不可加载（阻断）：入口导入（真正验证"能加载"，compileall 验不出 import 失败）----
  - { type: command, run: 'python -c "from app.main import app"', weight: 1, group: backend,
      tier: loadable, blocking: true, requires_deps: ["python:*"], timeout_s: 120 }
  - type: command
    run: "fe-build web"
    weight: 2
    group: frontend_build
    tier: loadable
    blocking: true
    requires: node
    # ★ v1.5：node 生态的依赖声明（`web/package.json` 里模型新增的包）镜像里没有
    #   ⇒ 该检查 skipped（环境缺失），而不是把「装不上依赖」记成「构建坏了」。
    requires_deps: ["node:*"]
    # ★ v1.3.1（T1.2，docs/13 §7.2.6）`requires_files`：探针（基线独立执行）的
    #   **前置文件**判定 —— 基线里连 `web/` 目录都没有（v1.2 时代的补丁产物就是
    #   这种形态）⇒ 该检查在**探针侧** `skipped`，报告写
    #   `baseline_incomplete`，而不是把"基线不完整"误判成"基线不健康"。
    #   ★ 合并树侧语义**不变**：交付树缺 `web/` 仍然 `failed`（阻断项）——
    #   这正是"基线不完整 ≠ 交付树可缺目录"的不对称（docs/13 §3-Q1）。
    #   ★ 加载期校验 22 禁止本字段与 skeleton 交叉：骨架里**没有** `web/**`，
    #   否则骨架补缺会让 `web/` 永远存在、这条声明恒真（配了等于没配）。
    requires_files: ["web/"]
    timeout_s: 300

# 分组配分（Q3）：runnability 维度内按组计点，合计 30 点 = 该维度满分。
# ∵ runnability 维度权重 0.30，1 个内点 = 1 个总分点
# ∴ 前端（静态 10 + 构建 10）占 **总分 20 分**，后端占 **总分 10 分**。
# ★ 四维权重（30/30/20/20）与双门槛（75/60）**一字未改**。
scoring:
  runnability_points:
    backend: 10
    frontend_static: 10
    frontend_build: 10
  frontend_scored_in_runnability: true

prompting:
  pm: PRD 必须声明后端为 FastAPI、前端为 Vue3，并说明数据持久化方案（SQLAlchemy + SQLite）。
  architect: 设计文档的目录结构必须与模板 layout 一致，不得引入 Django/Flask；前端只做结构设计。
  engineer: 严格遵守模板目录规范；固定提供的文件不要输出；给了最小版本的文件须输出完整版；新增依赖写入 requirements.txt。
  qa: >-
    证据链须引用模板检查命令的执行输出；前端要分成两条结论：
    ①「结构静态检查」看目录/SFC 结构/禁用依赖；②「前端构建」看 `fe-build web` 的退出码
    与 dist 产物。构建失败属**阻断项**（不可交付）；若构建因环境缺失被跳过，
    必须标注「前端构建未执行（环境缺失）」，不得据此判代码失败。
